    .tb-mark  { font-family: Georgia, 'Times New Roman', serif; font-size: 34px; fill: #3A332C; }
    .tb-light { fill: #8C7F70; }
  </style>
  <g transform="translate(20,30)">
    <circle cx="6" cy="10" r="6" fill="#FF5B2E"></circle>
    <circle cx="22" cy="10" r="6" fill="#B8893E"></circle>
    <circle cx="38" cy="10" r="6" fill="#E8B5A8"></circle>
  </g>
  <text x="80" y="50" class="tb-mark tb-text">Trio<tspan class="tb-light"> Brands</tspan></text>
</svg>
